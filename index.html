<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>My To-Do List</h1>
        <p>Catat tugasmu hari ini!</p>

        <form id="todo-form">
            <input type="text" id="todo-input" autocomplete="off" required>
            <button type="submit">Tambah</button>
        </form>

        <ul id="todo-list"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
